# Secret applicatif via Vault Secrets Operator, déclaré dans `extraObjects` du chart.
# À fusionner dans les values de l'environnement. Sur CPiN : le VaultAuth est créé par la console
# et s'appelle toujours `vault-auth` ; le mount est <organisation>-<projet> (kv v2).
extraObjects:
  app-secrets:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: app-secrets
    spec:
      vaultAuthRef: vault-auth
      mount: mi-monprojet          # <organisation>-<projet>
      path: monapp/dev             # chemin dans le kv
      type: kv-v2
      refreshAfter: 60s
      destination:
        name: app-secrets          # Secret Kubernetes créé
        create: true
      # rolloutRestartTargets:     # redémarre le workload quand le secret change
      # - kind: Deployment
      #   name: <nom du Deployment rendu>

# Référencer ensuite le Secret dans le composant :
# api:
#   envFrom:
#   - secretRef:
#       name: app-secrets
