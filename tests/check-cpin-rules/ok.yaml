# Rendu conforme (chart tobi adapté CPiN) : base des cas de test, chaque test en dérive un cas KO.
apiVersion: v1
kind: Service
metadata:
  name: monapp-monapp-api
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: monapp-monapp
    app: monapp
    component: node
    criticality: low
    env: dev
    tier: backend
    app.kubernetes.io/name: monapp-monapp-api
    app.kubernetes.io/instance: monapp
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: monapp-monapp-api
    app.kubernetes.io/instance: monapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monapp-monapp-api
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: monapp-monapp
    app: monapp
    component: node
    criticality: low
    env: dev
    tier: backend
    app.kubernetes.io/name: monapp-monapp-api
    app.kubernetes.io/instance: monapp
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: monapp-monapp-api
      app.kubernetes.io/instance: monapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: monapp-monapp
        app: monapp
        component: node
        criticality: low
        env: dev
        tier: backend
        app.kubernetes.io/name: monapp-monapp-api
        app.kubernetes.io/instance: monapp
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
      - name: registry-pull-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        image: harbor.example.gouv.fr/mi-monprojet/monapp:0.1.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        startupProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 2
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monapp-monapp-api
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: monapp-monapp
    app: monapp
    component: node
    criticality: low
    env: dev
    tier: backend
    app.kubernetes.io/name: monapp-monapp-api
    app.kubernetes.io/instance: monapp
    app.kubernetes.io/component: api
spec:
  rules:
  - host: monapp-dev.apps.gouv.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: monapp-monapp-api
            port:
              number: 80
